server.port=0
# Audio analysis engine (see README.md for semantics)
audio.analysis.target-sample-rate=44100
audio.analysis.window-size=1024
audio.analysis.window-type=HANN
audio.analysis.overlap-ratio=0.5
audio.analysis.silence-threshold-rms=1.0e-4
audio.analysis.onset-sensitivity=1.5
audio.analysis.onset-flux-floor=1.0
audio.analysis.strong-beat-ratio=2.0
audio.analysis.min-onset-interval-ms=60
audio.analysis.gap-policy=FILL_SILENCE
audio.analysis.max-reorder-frames=1048576
audio.analysis.input-queue-capacity=256
audio.analysis.output-queue-capacity=1024
